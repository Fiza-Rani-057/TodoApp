
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h1>My Todo List</h1>
        <p class="subtitle">Stay organized and get things done!</p>

        <div class="input-box">
            <input type="text" id="taskInput" placeholder="Enter a new task...">
            <button id="addBtn">Add</button>
        </div>

        <div class="task-info">
            <span>Total: <b id="totalTasks">0</b></span>
            <span>Completed: <b id="completedTasks">0</b></span>
            <span>Remaining: <b id="remainingTasks">0</b></span>
        </div>
        <ul id="taskList"></ul>

        <p id="emptyMessage">No tasks yet. Add your first task! </p>
    </div>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
